<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Door - Mini Games</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="game">

        <div id="hud">
            <div>LEVEL <span id="level">1</span></div>
            <div>❤️ <span id="lives">3</span></div>
        </div>

        <div id="crosshair">+</div>

        <div id="message">
            Click the game to begin
        </div>

        <div id="controls">
            WASD — Move &nbsp; | &nbsp;
            Mouse — Look
        </div>

        <div id="puzzle-panel" class="hidden">

            <div class="puzzle-box">

                <h2 id="puzzle-title">Logic Room</h2>

                <p id="puzzle-rule"></p>

                <div id="doors"></div>

                <p id="puzzle-hint">
                    Choose carefully...
                </p>

            </div>

        </div>


        <div id="result-card" class="hidden">

            <h1 id="result-title">Game Over</h1>

            <p id="result-text"></p>

            <button id="restart-button">
                Play Again
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
