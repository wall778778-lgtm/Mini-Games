<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Door</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div id="game">


<canvas id="gameCanvas"></canvas>



<!-- HUD -->

<div id="hud">

    <div>
        Level:
        <span id="level">1</span>
    </div>


    <div>
        ❤️
        <span id="lives">3</span>
    </div>

</div>




<!-- Center -->

<div id="crosshair">
+
</div>



<div id="message">
Click to start
</div>



<div id="interaction">
Press E
</div>





<!-- Puzzle -->

<div id="puzzlePanel">

<h2>🧠 Puzzle</h2>

<div id="puzzleText">
Find the clues...
</div>

</div>





<!-- Mobile -->

<div id="mobileControls">


<div id="joystick">

<div id="stick"></div>

</div>



<button id="interactButton">

OPEN

</button>


</div>





<div id="pcControls">

WASD Move |
Mouse Look |
E Interact

</div>



</div>




<script src="puzzles.js"></script>

<script src="script.js"></script>


</body>

</html>
