<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code Breaker - Mini Games</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="game-container">

<h1>🔐 Code Breaker</h1>

<p>Guess the 4 digit secret code</p>

<input id="guessInput" maxlength="4" placeholder="0000">

<button id="guessButton">Guess</button>

<div id="history"></div>

<div class="attempts">
Attempts: <span id="attempts">0</span>
</div>


<div id="result-card" class="hidden">

<h2 id="result-title"></h2>

<p id="result-score"></p>

<button id="restartButton">
Play Again
</button>
Play Again
</button>

</div>


</div>

<script src="script.js"></script>

</body>
</html>
