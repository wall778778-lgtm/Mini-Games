<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Mini Games</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header class="navbar">

    <a href="index.html" class="logo">
        🎮 Mini Games
    </a>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="games.html">
            Games
        </a>

    </nav>


</header>



<main class="auth-page">


<div class="auth-box">


<h1>
    Create Account
</h1>


<p>
    Join Mini Games
</p>



<form id="registerForm">


<input 
    type="text"
    id="username"
    placeholder="Username"
    required
>


<input 
    type="email"
    id="email"
    placeholder="Email"
    required
>


<input 
    type="password"
    id="password"
    placeholder="Password"
    required
>


<button type="submit">
    Register
</button>


</form>


<p id="message"></p>


</div>


</main>


<script src="/script.js"></script>


</body>

</html>
