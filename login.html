<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Mini Games</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">

    <a href="index.html" class="logo">
        Mini Games
    </a>

    <nav>
        <a href="index.html">Home</a>
        <a href="games.html">Games</a>
        <a href="community.html">Community</a>
    </nav>

    <div class="account">
        <a href="login.html" class="login-button active-button">Login</a>
        <a href="register.html" class="register-button">Register</a>
    </div>

</header>


<main class="auth-page">

    <div class="auth-box">

        <h1>Login</h1>

        <form>

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                name="email"
                required
            >


            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>


        <p>
            Don't have an account?
            <a href="register.html">Register</a>
        </p>

    </div>

</main>


<footer>

    <p>© 2026 Mini Games</p>

</footer>

</body>
</html>
